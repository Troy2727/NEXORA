# Alembic config for NEXORA. The database URL is not set here: db/alembic/env.py
# reads it from settings (DB_* or Neon's PG* environment variables).
#
#   alembic upgrade head                      apply migrations
#   alembic revision --autogenerate -m "..."  create one from model changes

[alembic]
script_location = %(here)s/db/alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = plain

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = plain

[formatter_plain]
format = %(levelname)s [%(name)s] %(message)s
