<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
      <title id="architecture-dark-title">NEXORA · System architecture</title>
      <desc id="architecture-dark-desc">Architecture diagram showing the NEXORA web app calling the FastAPI service over REST with JWT, where routers pass requests to use cases that hold the business rules, repositories persist to PostgreSQL, and use cases store verification codes in Redis and send verification email over SMTP.</desc>
