      <line x1="704" y1="132" x2="750" y2="132" stroke="#ff8a1f" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
      <line x1="844" y1="168" x2="844" y2="262" stroke="#b4b4bc" stroke-width="1.6" marker-end="url(#arrow)"/>
      <path d="M 580,168 V 212 Q 580,220 572,220 H 432 Q 424,220 424,228 V 262" fill="none" stroke="#b4b4bc" stroke-width="1.6" marker-end="url(#arrow)"/>
