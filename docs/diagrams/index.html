<!doctype html>
<!--
  README diagrams (HyperFrames). Each diagram is its own composition; this file plays them in a row.
    Check:   npx hyperframes@0.8.193 check .
    Videos:  npx hyperframes@0.8.193 render . -c compositions/architecture.html -o renders/architecture.mp4
             (same for data-model, task-lifecycle and signup-flow)
    GIFs:    ffmpeg -i renders/architecture.mp4 -vf "fps=15,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" renders/architecture.gif
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1150" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="diagram.css" />
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47" data-width="1600" data-height="1150">
      <div id="architecture-host" data-composition-id="architecture" data-composition-src="compositions/architecture.html" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="data-model-host" data-composition-id="data-model" data-composition-src="compositions/data-model.html" data-start="10" data-duration="13" data-track-index="0"></div>
      <div id="task-lifecycle-host" data-composition-id="task-lifecycle" data-composition-src="compositions/task-lifecycle.html" data-start="23" data-duration="10" data-track-index="0"></div>
      <div id="signup-flow-host" data-composition-id="signup-flow" data-composition-src="compositions/signup-flow.html" data-start="33" data-duration="14" data-track-index="0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
